# Builds retreats.ge and publishes it to GitHub Pages.
# Runs on every push, every 15 minutes (to pick up retreats added in the admin panel), and on demand.
name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jinja2
      - name: Build site with the latest retreats from the Google Sheet
        run: python3 _src/build.py --live
      - name: Collect the public files
        run: |
          mkdir _site
          rsync -a --exclude '_site' --exclude '_src' --exclude '.git' --exclude '.github' --exclude 'README.md' ./ _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
