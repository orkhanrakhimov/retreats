<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retreats.ge — Yoga Retreats in Georgia</title>
<meta name="description" content="Yoga retreats in the mountains, vineyards and coast of Georgia. Coming soon.">
<style>
  :root { --cream:#f4efe6; --ink:#2f2b26; --olive:#6b6a4a; --clay:#b7795a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body {
    background:var(--cream); color:var(--ink);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:2rem;
  }
  main { max-width:36rem; }
  .mark { width:56px; height:56px; margin:0 auto 2rem; border:1.5px solid var(--olive); border-radius:50%;
          display:flex; align-items:center; justify-content:center; }
  .mark span { width:18px; height:18px; background:var(--clay); border-radius:50%; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight:400; font-size:clamp(2.2rem,6vw,3.4rem);
       letter-spacing:.01em; line-height:1.15; }
  .ka { margin-top:.75rem; font-size:1.1rem; color:var(--olive); }
  .rule { width:48px; height:1px; background:var(--clay); margin:2rem auto; }
  p.soon { text-transform:uppercase; letter-spacing:.3em; font-size:.8rem; color:var(--olive); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><span></span></div>
  <h1>Yoga Retreats in Georgia</h1>
  <p class="ka" lang="ka">იოგა რიტრიტები საქართველოში</p>
  <div class="rule"></div>
  <p class="soon">Coming soon · მალე</p>
</main>
</body>
</html>
